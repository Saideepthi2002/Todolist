<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f3f4f6;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
        }
  
        #form {
          background-color: #ffffff;
          padding: 30px 40px;
          border-radius: 10px;
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
          width: 320px;
        }
  
        h1 {
          text-align: center;
          margin-bottom: 20px;
          color: #333;
        }
  
        label {
          display: block;
          margin-top: 10px;
          color: #555;
          font-weight: bold;
        }
  
        input[type="text"],
        input[type="password"] {
          width: 100%;
          padding: 10px;
          margin-top: 5px;
          margin-bottom: 15px;
          border: 1px solid #ccc;
          border-radius: 5px;
          font-size: 14px;
        }
  
        button {
          width: 100%;
          padding: 10px;
          font-size: 16px;
          border: none;
          border-radius: 5px;
          cursor: pointer;
          margin-top: 10px;
        }
  
        #signup {
          background-color: #4caf50;
          color: white;
        }
  
        #signup:hover {
          background-color: #45a049;
        }
  
        #login {
          background-color: #2196f3;
          color: white;
        }
  
        #login:hover {
          background-color: #1976d2;
        }
      a{
        text-decoration:none;
        color:#1976d2;
        font-weight:700;
      }
      a:hover{
        color:red;
      }
      </style>
  </head>
  <body>
    <h1></h1>
    <form id="form">
     <h1>SignUp</h1>
      <label for="username">Username:</label>
      <input type="text" id="username" required />
      <br /><br />

      <label for="password">Password:</label>
      <input type="password" id="password" required />
      <br /><br />
      <button type="submit" id="signup">SignUp</button>
      
      <p>If you have an Account,<a href="Login.html">Login</a></p>
    </form>
    <script>
      let username = document.getElementById("username");
      let password = document.getElementById("password");
      let signup = document.getElementById("signup");
      let form = document.getElementById("form");
      let login=document.getElementById('login')

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        let getData = JSON.parse(localStorage.getItem("RegisterData"));
        console.log(getData)

        if (getData === null) {
          getData = [];
        }

        let userExist=false
        getData.forEach(element => {
            if(element.username==username.value && element.password==password.value){
                userExist=true
            }  
        });
        if(userExist==true){
            alert('user already exist!!! go to login')
            username.value=''
            password.value=''
            // window.location.href='login.html'
            return
        }
        else if(userExist==false){
            let obj={
                username:username.value,
                password:password.value
            }
            getData.push(obj)
            localStorage.setItem('RegisterData',JSON.stringify(getData))
            alert('Registered Succesfully')
            window.location.href='Login.html'
        }
      });
      login.addEventListener('click',()=>{
        window.location.href='login.html'
      })


    </script>
  </body>
</html>
